x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"


services:
  rewrite-service:
    build: .
    environment:
      CONFIG_PATH: /config/config.json
      COMPOSE_FILE: /tmp/docker-compose.yaml
      COMPOSE_SERVICE: rewrite-service
      ALLOW_MU_AUTH_SUDO: "true"
      MU_SPARQL_UPDATEPOINT: http://database:8890/sparql
      MU_SPARQL_ENDPOINT: http://database:8890/sparql
      LOG_LEVEL: INFO
      LLM__API_KEY: ${OPENAI_API_KEY}
    volumes:
      - ./:/app
      - ./config-openai.json:/config/config.json:ro
      - ./docker-compose.yml:/tmp/docker-compose.yaml:ro
    ports:
      - "8080:80"
  database:
    image: semtech/mu-authorization:0.6.0-beta.5
    environment:
      MU_SPARQL_ENDPOINT: http://triplestore:8890/sparql
    volumes:
      - ./config/authorization:/config:ro
  triplestore:
    image: redpencil/virtuoso:1.4.0
    environment:
      SPARQL_UPDATE: "true"
    volumes:
      - ./config/virtuoso/virtuoso.ini:/data/virtuoso.ini
      - ./data/db:/data
    labels:
      - "logging=true"
    restart: always
    logging: *default-logging
    ports:
      - "8890:8890"